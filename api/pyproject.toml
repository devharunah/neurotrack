[project]
name = "neurotrack-api"
version = "0.1.0"
description = "NeuroTrack scientific computing API: quantum circuits, QML experiments, behavioural analytics."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "qiskit>=2.0",
  "qiskit-aer>=0.17",
  "qiskit-machine-learning>=0.8",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
