# Weekly dependency updates. Dependabot opens PRs; CI (including the security job) checks them.
version: 2
updates:
  # Web app (pnpm-lock.yaml is detected by the npm ecosystem).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Patch and minor releases of dev tooling arrive as one PR.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  # API (api/pyproject.toml + api/uv.lock).
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # API image base tags (python:3.12-slim, ghcr.io/astral-sh/uv).
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    ignore:
      # pyproject.toml pins Python to 3.12 (requires-python ">=3.12,<3.13").
      - dependency-name: python
        versions: [">=3.13"]

  # Workflow actions, including the local composite action in .github/actions/setup.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup]
    schedule:
      interval: weekly
